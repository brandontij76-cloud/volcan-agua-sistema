<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitoreo de recorrido - Volcan de Agua</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-volcan">
    <div class="container">
      <a class="navbar-brand" href="index.html">Volcan de Agua &middot; Santa Maria de Jesus</a>
      <span class="badge bg-light text-dark" id="badgeEstado">Conectando...</span>
    </div>
  </nav>

  <main class="container my-4">
    <h2 id="tituloExcursionista">Monitoreo de recorrido</h2>
    <p class="text-muted">Deja esta pagina abierta durante tu recorrido. Tu ubicacion se envia automaticamente cada 30 segundos.</p>

    <div class="row g-3 mb-3">
      <div class="col-md-8">
        <div id="mapa"></div>
      </div>
      <div class="col-md-4">
        <div class="card p-3 h-100">
          <h6>Estado del monitoreo</h6>
          <p class="mb-1">Ubicacion GPS: <span id="estadoGps" class="fw-bold">Esperando permiso...</span></p>
          <p class="mb-1">Ultimo envio: <span id="ultimoEnvio">--</span></p>
          <p class="mb-3">Precision: <span id="precisionGps">--</span></p>

          <button id="btnPanico" class="btn btn-panico btn-lg w-100 mb-2">
            🆘 Boton de emergencia
          </button>
          <button id="btnFinalizar" class="btn btn-outline-secondary w-100">
            Finalizar recorrido (regrese sin novedad)
          </button>

          <div id="mensajeAlerta" class="alert alert-warning mt-3 d-none"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/monitor.js"></script>
</body>
</html>
